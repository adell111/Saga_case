# JSON-схемы API кредитного конвейера, кейс 2
#
# Проект API. HTTP-сервер не реализован, прототип работает как консольная
# программа (04_прототип.py). Схема Application (образец) не менялась.
#
# Про образец Application: age 18-70 и amount до 5 000 000 это общий контракт.
# Прототип не отбрасывает заявку с возрастом вне 18-70, а отвечает REFUSED с
# причиной AGE_OUT_OF_RANGE (правило 1). Лимиты продукта prod_standard
# (сумма до 1 000 000) дают REFUSED / AMOUNT_LIMIT.
# Для NEED_MORE_DATA из-за ошибки проверки данных score и dti пустые: заявка не дошла
# до скоринга. При таймауте внешнего сервиса поля могут быть заполнены частично.
# Поля ответа повторяют колонки decisions.csv. Текст для клиента лежит в поле message.

openapi: 3.0.3
info:
  title: Fin-Tech Credit Conveyor
  version: "1.0.0"
  description: Приём заявки, эмуляция БКИ/СМЭВ, скоринг, предварительное решение

servers:
  - url: http://localhost:8082

# ---------- ОБРАЗЕЦ: Application, не трогать ----------
components:
  schemas:
    Application:
      type: object
      required: [app_id, age, income, employment, family, amount, term]
      additionalProperties: false
      properties:
        app_id: {type: string, pattern: '^app_[0-9]{4}$'}
        client_id: {type: string, pattern: '^cli_[0-9]{4}$'}
        passport_hash: {type: string, pattern: '^[a-f0-9]{16}$'}
        age: {type: integer, minimum: 18, maximum: 70}
        income: {type: number, exclusiveMinimum: 0}
        employment:
          enum: [employed, self-employed, student, retired, unemployed]
        family:
          enum: [single, married, children]
        amount: {type: number, minimum: 10000, maximum: 5000000}
        term: {type: integer, minimum: 3, maximum: 60}

# ---------- ответы конвейера ----------
    Decision:
      type: object
      description: Решение по заявке. Поля amount_approved, term_approved и rate заполняются только для APPROVED
      required: [app_id, decision, reason]
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9]{4}$'
        decision:
          type: string
          description: MANUAL_REVIEW возможное расширение, в прототипе не реализовано
          enum: [APPROVED, REFUSED, NEED_MORE_DATA, MANUAL_REVIEW]
        reason:
          type: string
          description: >-
            Код причины из 08_reasons.md, для APPROVED пустая строка.
            VALIDATION_ERROR это любая ошибка проверки полей заявки (какое именно поле,
            видно в message).
          enum:
            - AGE_OUT_OF_RANGE
            - INVALID_EMPLOYMENT
            - MISSING_INCOME
            - LOW_INCOME
            - HIGH_DTI
            - BKI_DELINQUENCY
            - AMOUNT_LIMIT
            - TERM_OUT_OF_RANGE
            - SMEV_MISMATCH
            - LOW_SCORE
            - EXTERNAL_TIMEOUT
            - VALIDATION_ERROR
            - ''
        message:
          type: string
          description: Понятный клиенту текст (колонка message в decisions.csv), для APPROVED пустая строка
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Балл скоринга. Пусто, если заявка остановлена на проверке данных (VALIDATION_ERROR, MISSING_INCOME)
        dti:
          type: number
          nullable: true
          minimum: 0
          description: Платёж по аннуитету делить на доход, порог 0.5, в ответе округлён до 2 знаков. Пусто, если заявка остановлена на проверке данных или доход равен нулю
        amount_approved:
          description: Одобренная сумма, заполняется только для APPROVED (как колонка decisions.csv)
          type: number
          nullable: true
          minimum: 10000
        term_approved:
          description: Одобренный срок в месяцах, только для APPROVED
          type: integer
          nullable: true
          minimum: 3
          maximum: 60
        rate:
          description: Годовая ставка (0.18 = 18 %), только для APPROVED
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        bki:
          type: object
          properties:
            score: {type: integer, minimum: 300, maximum: 850}
            delinquency: {type: boolean}
            inquiries_90d: {type: integer, minimum: 0}
        smev:
          type: string
          enum: [MATCH, MISMATCH, TIMEOUT, NOT_CALLED]

    ExternalRequest:
      type: object
      required: [request_id, app_id, service, status, latency_ms]
      properties:
        request_id:
          type: string
          pattern: '^req_[0-9]{4,}$'
        app_id:
          type: string
          pattern: '^app_[0-9]{4}$'
        service:
          type: string
          enum: [BKI, SMEV]
        status:
          type: string
          enum: [SUCCESS, TIMEOUT, ERROR]
        latency_ms:
          type: integer
          minimum: 0
        result:
          type: object
          additionalProperties: true
          description: Краткий ответ сервиса, без персональных данных
        timestamp:
          type: string
          format: date-time
          description: Время вызова, как в поле timestamp файла external.log

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 'Поле age должно быть от 18 до 70'
        field:
          type: string
          nullable: true
          description: Имя поля заявки, если ошибка относится к одному полю
        retryable:
          type: boolean
          description: true, если запрос можно безопасно повторить
        details:
          type: object
          additionalProperties: true

# ---------- paths ----------
paths:
  # ---------- ОБРАЗЕЦ: health ----------
  /health:
    get:
      summary: Проверка живости
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string}}}

  # ---------- подача заявки ----------
  /api/v1/applications:
    post:
      summary: Принять заявку и вернуть предварительное решение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      responses:
        '201':
          description: Заявка принята, решение рассчитано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '422':
          description: Ошибка валидации полей заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Заявка с таким app_id уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------- решение по заявке ----------
  /api/v1/applications/{id}/decision:
    get:
      summary: Получить решение по заявке
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^app_[0-9]{4}$'
      responses:
        '200':
          description: Решение найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '425':
          description: Решение ещё рассчитывается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------- пересчёт (опционально) ----------
  /api/v1/applications/{id}/recalculate:
    post:
      summary: Пересчитать решение по заявке (опционально, в прототипе не реализовано)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^app_[0-9]{4}$'
      responses:
        '200':
          description: Новое решение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пересчёт невозможен, например заявка уже выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
